<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>User Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../photo/favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- BACK BUTTON (Top Left) -->
<div class="back-button-container">
    <form action="../php/index.php" method="POST">
        <button type="submit" class="back-button">Back</button>
    </form>
</div>

<div class="container mt-4" style="max-width: 500px;">
    <img src="../photo/bmw.jpeg" alt="BMW Logo" width="150" height="150" class="d-block mx-auto" />
    <div id="status-message"></div>

    <h1 class="text-center">Login</h1>
    <form id="loginForm" method="POST" action="../php/login.php">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required class="form-control mb-2" autocomplete="username" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required class="form-control mb-2" autocomplete="current-password" />

        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="showPassword" onclick="togglePassword()" />
            <label class="form-check-label" for="showPassword">Show Password</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>

        <div class="text-center mt-3">
            <a href="register_user.html">Register here</a>
        </div>
    </form>
</div>

<script>
    function togglePassword() {
        const pw = document.getElementById("password");
        pw.type = pw.type === "password" ? "text" : "password";
    }

    const params = new URLSearchParams(window.location.search);
    const status = params.get("status");
    const msgDiv = document.getElementById("status-message");

    if (status === "registered") {
        msgDiv.innerHTML = `<div class="alert alert-success">Your account has been successfully registered! You can now log in.</div>`;
    } else if (status === "wrongpassword") {
        msgDiv.innerHTML = `<div class="alert alert-danger">Incorrect password. Please try again.</div>`;
    } else if (status === "nouser") {
        msgDiv.innerHTML = `<div class="alert alert-warning">Username not found. Please register first.</div>`;
    }
</script>
</body>
</html>
