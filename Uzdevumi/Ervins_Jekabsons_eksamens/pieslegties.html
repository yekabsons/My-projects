<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video un Pieslēgšanās - Viss par suņiem</title>
    <link rel="icon" type="image/x-icon" href="images.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Roboto', sans-serif;
        }

        .uiverse-back-btn {
            background-color: #ffffff;
            text-align: center;
            width: 12rem;
            border-radius: 1rem;
            height: 3.5rem;
            position: relative;
            color: #000000;
            font-size: 1.25rem;
            font-semibold: 600;
            border: none;
            cursor: pointer;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .uiverse-back-btn .icon-container {
            background-color: #4ade80;
            border-radius: 0.75rem;
            height: 3rem;
            width: 25%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 4px;
            top: 4px;
            z-index: 10;
            transition: width 0.5s ease;
        }


        .uiverse-back-btn p {
            margin: 0;
            transform: translateX(8px);
            z-index: 5;
            transition: color 0.3s ease;
        }

        .uiverse-back-btn:hover .icon-container {
            width: 184px;
        }

        .uiverse-back-btn:hover p {
            color: #000000;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Suns un Video</span>

        <a href="index.html" class="uiverse-back-btn">
            <div class="icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" height="25px" width="25px">
                    <path d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z" fill="#000000"></path>
                    <path d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z" fill="#000000"></path>
                </svg>
            </div>
            <p>Go Back</p>
        </a>
    </div>
</nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <h1 class="mb-4 text-uppercase fw-bold text-secondary">Izglītojošs video par suņiem</h1>

            <div class="ratio ratio-16x9 shadow-lg rounded-3 overflow-hidden bg-black mx-auto" style="max-width: 900px;">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0" title="Rick Astley - Never Gonna Give You Up" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <p class="mt-4 text-muted fs-5">
                Noskaties šo video, lai uzzinātu vairāk par suņu uzvedību, dabu un to, kā viņi uztver pasauli mums apkārt.
            </p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
