<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zīmēšanas Redaktors</title>
  <link rel="icon" type="image/x-icon" href="download.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Zīmēšanas Redaktors</h1>

<div id="controls">
  <label for="colorPicker">Krāsa:</label>
  <input type="color" id="colorPicker" value="#000000">

  <label for="brushSize">Otas biezums:</label>
  <input type="range" id="brushSize" min="1" max="50" value="5">

  <button id="clearBtn">Notīrīt visu</button>
</div>

<canvas id="drawCanvas" width="800" height="500"></canvas>

<script src="script.js"></script>

</body>
</html>
