<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>9. Uzdevums</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            transition: background-color 0.3s ease;
        }
        .gray-block {
            background-color: #6c757d;
            background: linear-gradient(to bottom, #8a939b, #5c636a);
            padding: 20px;
            margin-top: 20px;
        }
        #hoverBloks {
            padding: 20px;
            transition: background-color 0.3s ease;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>

<div class="container text-center mt-4">

    <h2 class="mb-3">Jautājumi?</h2>

    <div>
        <button class="btn btn-secondary mb-3" onclick="raditPazinojumu()">Paziņojuma logs</button>
    </div>
    <div>
        <button class="btn btn-secondary mb-3" onclick="ievaditVardu()">Teksta ievades logs</button>
    </div>

    <h3 class="mb-3" id="tekstaIzvade">Teksta izvades vieta</h3>

    <div>
        <button class="btn btn-secondary mb-3" onclick="ievaditSkaitli()">Skaitļa ievade!</button>
    </div>

    <h3 class="mb-4" id="skaitlaIzvade">Nepāra skaitlis!</h3>

</div>

<div class="container-fluid text-center gray-block">
    <h2 class="text-white mb-3">Fona krāsas maiņa (body)</h2>
    <button class="btn btn-primary m-1" onclick="mainitBodyFonu('#0d6efd')">Tumši zils fons</button>
    <button class="btn btn-success m-1" onclick="mainitBodyFonu('#198754')">Zaļš fons</button>
    <button class="btn btn-danger m-1" onclick="mainitBodyFonu('#dc3545')">Sarkans fons</button>
    <button class="btn btn-warning m-1" onclick="mainitBodyFonu('#ffc107')">Dzeltens fons</button>
    <button class="btn btn-info m-1" onclick="mainitBodyFonu('#0dcaf0')">Gaiši zils fons</button>
    <button class="btn btn-light m-1" onclick="mainitBodyFonu('#ffffff')">Balts fons</button>
</div>

<div class="container-fluid text-center" id="hoverBloks">
    <h2 id="hoverVirsraksts" class="mb-3">Fona krāsas maiņa (šis bloks)</h2>
    <button class="btn btn-success m-1" onmouseover="mainitBlokaFonu('#198754')" onmouseout="atjaunotBlokaFonu()">Zaļš fons</button>
    <button class="btn btn-danger m-1" onmouseover="mainitBlokaFonu('#dc3545')" onmouseout="atjaunotBlokaFonu()">Sarkans fons</button>
    <button class="btn btn-warning m-1" onmouseover="mainitBlokaFonu('#ffc107')" onmouseout="atjaunotBlokaFonu()">Dzeltens fons</button>
    <button class="btn btn-info m-1" onmouseover="mainitBlokaFonu('#0dcaf0')" onmouseout="atjaunotBlokaFonu()">Gaiši zils fons</button>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
