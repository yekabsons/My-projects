<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulators</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-4 calc-container">
      <h2 class="mb-4">Kalkulators</h2>

      <table class="table table-borderless">
        <tr>
          <td>Pirmais skaitlis:</td>
          <td><input type="text" id="sk1" class="form-control" placeholder="Ievadiet vērtību:"></td>
        </tr>
        <tr>
          <td>Otrais skaitlis:</td>
          <td><input type="text" id="sk2" class="form-control" placeholder="Ievadiet vērtību: "></td>
        </tr>
        <tr>
          <td>Matemātiskā darbība:</td>
          <td>
            <div class="btn-group w-100">
              <button onclick="aprekinat('+')" class="btn btn-custom">+</button>
              <button onclick="aprekinat('-')" class="btn btn-custom">-</button>
              <button onclick="aprekinat('*')" class="btn btn-custom">*</button>
              <button onclick="aprekinat('/')" class="btn btn-custom">/</button>
            </div>
          </td>
        </tr>
        <tr>
          <td><strong>Rezultāts:</strong></td>
          <td><input type="text" id="rezultats" class="form-control bg-light" readonly placeholder="Tiks parādīts rezultāts"></td>
        </tr>
        <tr>
          <td>Matemātiskā izteiksme:</td>
          <td><input type="text" id="izteiksme" class="form-control" placeholder="5+6*2/7"></td>
        </tr>
        <tr>
          <td><button onclick="aprekinatIzteiksmi()" class="btn btn-custom w-100">Rēķināt</button></td>
          <td><input type="text" id="izteiksmes_rez" class="form-control bg-light" readonly placeholder="Rezultāts"></td>
        </tr>
      </table>

      <div class="text-center mt-3">
        <button onclick="notirit()" class="btn btn-custom mb-2">Attīrīt</button><br>
        <button class="btn btn-custom" data-bs-toggle="modal" data-bs-target="#reizrekinsModal" onclick="generetReizrekinu()">Piemirsi rēizreiķinu?</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="reizrekinsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title w-100 text-center">Reizrēķins</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center" id="modal-body-content">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-custom" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
