<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Detaļas | Auto Noma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Navigācija -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success" href="index.html">AutoNoma</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Sākums</a></li>
                <li class="nav-item"><a class="nav-link" href="ka-tas-strada.html">Kā tas strādā?</a></li>
                <li class="nav-item"><a class="nav-link" href="cenas.html">Cenas</a></li>
                <li class="nav-item ms-lg-3">
                    <a href="ienakt.html" class="btn btn-outline-success px-4 rounded-pill">Ienākt</a>
                </li>
                <li class="nav-item ms-lg-3 d-flex align-items-center">
                    <button id="darkModeToggle" class="btn btn-outline-light rounded-circle shadow-sm ms-3" style="width: 40px; height: 40px; padding: 0; line-height: 1;">
                        🌙
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Auto detaļu sekcija -->
<main class="container py-5">
    <div class="row align-items-center bg-white p-4 p-md-5 rounded shadow-sm" id="carDetailContainer">
        <!-- Šeit JavaScript automātiski ievietos mašīnas datus -->
        <div class="text-center w-100 py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-3 text-muted">Ielādējam transportlīdzekļa informāciju...</p>
        </div>
    </div>
</main>

<!-- Skripti -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- SVARĪGI: Pārliecinies, ka mapes nosaukums šeit sakrīt (js vai javascript) -->
<script src="js/cars.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("carDetailContainer");

        // 1. Paņemam auto ID no URL adrešu joslas (piem. ?auto=bmw)
        const urlParams = new URLSearchParams(window.location.search);
        const carId = urlParams.get("auto");

        // 2. Pārbaudām, vai dati vispār ir ielādējušies
        if (typeof carsData !== 'undefined' && carId) {
            // Meklējam auto mūsu sarakstā
            const car = carsData.find(c => c.id === carId);

            if (car) {
                // 3. Ja auto atrasts, zīmējam dizainu
                container.innerHTML = `
                    <div class="col-lg-6 mb-4 mb-lg-0 text-center">
                        <img src="${car.img}" alt="${car.brand} ${car.model}" class="img-fluid rounded shadow" style="object-fit: cover; max-height: 450px; width: 100%;">
                    </div>
                    <div class="col-lg-6 ps-lg-5">
                        <span class="badge bg-success mb-2 fs-6 px-3 py-2 rounded-pill">${car.type}</span>
                        <h1 class="fw-bold mb-3 display-5">${car.brand} <span class="text-muted">${car.model}</span></h1>

                        <div class="card mb-4 border-success bg-light">
                            <div class="card-body p-4">
                                <h4 class="card-title text-success fw-bold mb-3">Izmaksas</h4>
                                <ul class="list-unstyled mb-0 fs-5">
                                    <li class="mb-3 d-flex justify-content-between border-bottom pb-2">
                                        <span>⏱️ Braukšana (minūtē)</span> <strong>${car.price}</strong>
                                    </li>
                                    <li class="mb-3 d-flex justify-content-between border-bottom pb-2">
                                        <span>📅 24 stundu tarifs</span> <strong>${car.day}</strong>
                                    </li>
                                    <li class="d-flex justify-content-between">
                                        <span>🛣️ Maksa par kilometru</span> <strong>${car.km}</strong>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="rentNowBtn" class="btn btn-success btn-lg rounded-pill shadow-sm fw-bold py-3">Rezervēt šo auto</button>
                            <a href="cenas.html" class="btn btn-outline-secondary rounded-pill py-2 mt-2">Atpakaļ uz sarakstu</a>
                        </div>
                    </div>
                `;

                // 4. Pievienojam rezervācijas pogai funkciju
                document.getElementById("rentNowBtn").addEventListener("click", () => {
                    alert(`Super! ${car.brand} ${car.model} ir veiksmīgi rezervēts. Laimīgu ceļu uz Dobeli!`);
                    window.location.href = "index.html"; // Aizvedam atpakaļ uz sākumlapu
                });

            } else {
                container.innerHTML = `<div class="alert alert-warning w-100 text-center fs-5">Atvainojiet, šāds auto netika atrasts!</div>`;
            }
        } else {
            container.innerHTML = `<div class="alert alert-danger w-100 text-center fs-5">Sistēmas kļūda: Nevaram ielādēt datus (pārbaudi js/cars.js).</div>`;
        }
    });
</script>
</body>
</html>
