<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pieslēgties | Auto Noma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navigācija -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-success" href="index.html">AutoNoma</a>
    <div class="ms-auto">
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Atpakaļ uz sākumu</a>
    </div>
  </div>
</nav>

<!-- Pieteikšanās forma centrā -->
<main class="container d-flex align-items-center justify-content-center flex-grow-1 py-5">
  <div class="card border-0 shadow-lg p-4 p-md-5 w-100" style="max-width: 450px; border-radius: 20px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold">Pieslēgties / Reģistrēties</h2>
      <p class="text-muted">Ievadi datus, lai piekļūtu auto rezervācijai</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="loginEmail" class="form-label text-muted">E-pasta adrese</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="tavs@epasts.lv" required>
      </div>
      <div class="mb-4">
        <label for="loginPassword" class="form-label text-muted">Parole</label>
        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold mb-3">Turpināt</button>
    </form>

    <div id="formMessage" class="mt-3"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
