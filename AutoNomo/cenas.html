<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cenas | Auto Noma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-body-tertiary">

<!-- Navigācija -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-success" href="index.html">AutoNoma</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Sākums</a></li>
        <li class="nav-item"><a class="nav-link" href="ka-tas-strada.html">Kā tas strādā?</a></li>
        <li class="nav-item"><a class="nav-link active" href="cenas.html">Cenas</a></li>
        <li class="nav-item ms-lg-3">
          <a href="ienakt.html" class="btn btn-outline-success px-4 rounded-pill">Ienākt</a>
        </li>
        <li class="nav-item ms-lg-3 d-flex align-items-center">
          <button id="darkModeToggle" class="btn btn-outline-light rounded-circle shadow-sm ms-3" style="width: 40px; height: 40px; padding: 0; line-height: 1;">
            🌙
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Cenu sadaļa -->
<main class="container py-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold">Cenrādis un Auto Klases</h1>
    <p class="text-muted">Visi mūsu autoparkā pieejamie transportlīdzekļi un to izmaksas.</p>
  </div>
  <div class="d-flex justify-content-center flex-wrap gap-2 mb-4" id="filterButtons">
    <button class="btn btn-success active" data-filter="all">Visi auto</button>
    <button class="btn btn-outline-success" data-filter="Premium">Premium</button>
    <button class="btn btn-outline-success" data-filter="Kompaktklase">Kompaktklase</button>
    <button class="btn btn-outline-success" data-filter="Ekonomiskais">Ekonomiskais</button>
    <button class="btn btn-outline-success" data-filter="Universālis">Universālis</button>
  </div>
  <div class="table-responsive shadow-sm rounded bg-white">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark">
      <tr>
        <th scope="col" class="py-3 px-4">Auto</th>
        <th scope="col" class="py-3 px-4">Klase un Modelis</th>
        <th scope="col" class="py-3 px-4 text-center">Minūte</th>
        <th scope="col" class="py-3 px-4 text-center">24h</th>
        <th scope="col" class="py-3 px-4 text-center">Km maksa</th>
        <th scope="col" class="py-3 px-4 text-center">Darbība</th>
      </tr>
      </thead>
      <tbody id="pricesTableBody">
      <!-- JS aizpildīs tabulu -->
      </tbody>
    </table>
  </div>
</main>

<!-- Svarīga secība: Bootstrap -> cars.js -> main.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/cars.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
